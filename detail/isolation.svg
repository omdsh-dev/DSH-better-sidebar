<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Two conversations, each with its own sidebar: one shows files and editor, the other shows a side chat, with independent state">
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="iso-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4D6BFE"/>
    </marker>
  </defs>
  <rect width="640" height="300" rx="12" fill="#F5F6FC"/>
  <line x1="24" y1="150" x2="616" y2="150" stroke="#DDE3F0" stroke-dasharray="4 5"/>
  <!-- conversation A -->
  <rect x="24" y="30" width="204" height="108" rx="10" fill="#FFFFFF" stroke="#E6EAF3"/>
  <circle cx="44" cy="52" r="10" fill="#E8EDFF"/>
  <text x="44" y="55.5" class="ui" font-size="9" font-weight="700" fill="#3150D8" text-anchor="middle">A</text>
  <rect x="60" y="46" width="88" height="6" rx="3" fill="#C9D0DE"/>
  <rect x="60" y="57" width="56" height="5" rx="2.5" fill="#E1E6F0"/>
  <rect x="40" y="74" width="168" height="6" rx="3" fill="#DDE3EE"/>
  <rect x="40" y="86" width="132" height="6" rx="3" fill="#DDE3EE"/>
  <rect x="40" y="104" width="108" height="22" rx="7" fill="#F3F6FF" stroke="#C9D6FF"/>
  <path d="M50 111h6l4 4v8h-10z" fill="#4D6BFE" opacity="0.85"/>
  <text x="64" y="119.5" class="ui" font-size="8.5" font-weight="600" fill="#3150D8">App.tsx</text>
  <!-- arrow A -->
  <path d="M232 84 C268 84 304 84 342 84" fill="none" stroke="#4D6BFE" stroke-width="1.4" marker-end="url(#iso-arrow)"/>
  <circle cx="286" cy="84" r="8" fill="#4D6BFE"/>
  <text x="286" y="87" class="ui" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <!-- sidebar A -->
  <rect x="352" y="26" width="264" height="116" rx="10" fill="#1F2433" opacity="0.05"/>
  <rect x="350" y="24" width="264" height="116" rx="10" fill="#FFFFFF" stroke="#DFE4EF"/>
