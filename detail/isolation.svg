    <text x="516" y="84" fill="#3B4252" font-weight="600">src</text>
    <path d="M502 92h7l2 2v6h-9z" fill="#9DB0F0"/>
    <text x="514" y="99">App.tsx</text>
    <path d="M502 106h7l2 2v6h-9z" fill="#9DB0F0"/>
    <text x="514" y="113">index.ts</text>
  </g>
  <!-- conversation B -->
  <rect x="24" y="162" width="204" height="108" rx="10" fill="#FFFFFF" stroke="#E6EAF3"/>
  <circle cx="44" cy="184" r="10" fill="#E8EDFF"/>
  <text x="44" y="187.5" class="ui" font-size="9" font-weight="700" fill="#3150D8" text-anchor="middle">B</text>
  <rect x="60" y="178" width="76" height="6" rx="3" fill="#C9D0DE"/>
  <rect x="60" y="189" width="48" height="5" rx="2.5" fill="#E1E6F0"/>
  <rect x="40" y="206" width="156" height="6" rx="3" fill="#DDE3EE"/>
  <rect x="40" y="218" width="118" height="6" rx="3" fill="#DDE3EE"/>
  <rect x="40" y="236" width="120" height="22" rx="7" fill="#F3F6FF" stroke="#C9D6FF"/>
  <circle cx="52" cy="243" r="2.6" fill="#4D6BFE"/>
  <rect x="60" y="240" width="72" height="4" rx="2" fill="#9DB0F0"/>
  <rect x="60" y="248" width="48" height="4" rx="2" fill="#C4CFF5"/>
  <!-- arrow B -->
  <path d="M232 216 C268 216 304 216 342 216" fill="none" stroke="#4D6BFE" stroke-width="1.4" marker-end="url(#iso-arrow)"/>
  <circle cx="286" cy="216" r="8" fill="#4D6BFE"/>
  <text x="286" y="219" class="ui" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <!-- sidebar B -->
  <rect x="352" y="158" width="264" height="116" rx="10" fill="#1F2433" opacity="0.05"/>
  <rect x="350" y="156" width="264" height="116" rx="10" fill="#FFFFFF" stroke="#DFE4EF"/>
  <!-- icon-only tabs B, chat active -->
  <path d="M366 168h7l2 2h4v7h-13z" fill="#C9D0DE"/>
  <rect x="386" y="166" width="26" height="18" rx="5" fill="#E8EDFF"/>
  <path d="M393 171h10v7h-4l-3 3v-3h-3z" fill="#4D6BFE"/>
  <path d="M424 170h6M424 174h4" stroke="#C9D0DE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="360" y1="190" x2="604" y2="190" stroke="#EDF0F7"/>
  <circle cx="370" cy="202" r="7" fill="#4D6BFE"/>
  <text x="370" y="204.6" class="ui" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="384" y="196" width="176" height="22" rx="8" fill="#F3F6FF"/>
  <rect x="394" y="203" width="128" height="5" rx="2.5" fill="#9DB0F0"/>
  <rect x="484" y="226" width="76" height="22" rx="8" fill="#FFFFFF" stroke="#DFE4EF"/>
  <rect x="492" y="233" width="56" height="5" rx="2.5" fill="#DDE3EE"/>
  <rect x="350" y="256" width="264" height="4" rx="2" fill="#E8EDFF"/>
</svg>
