  <path d="M390 40l4 3-4 3" stroke="#8A93A6" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M404 40h6M404 44h4" stroke="#8A93A6" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="360" y1="58" x2="604" y2="58" stroke="#EDF0F7"/>
  <!-- mini editor A -->
  <rect x="360" y="66" width="84" height="14" rx="4" fill="#F8FAFF" stroke="#DFE4EF"/>
  <circle cx="368" cy="73" r="2.2" fill="#4D6BFE"/>
  <text x="374" y="76" class="ui" font-size="7.5" font-weight="600" fill="#3150D8">App.tsx</text>
  <g class="mono" font-size="7.2">
    <text x="362" y="96" fill="#7C3AED">import</text><text x="392" y="96" fill="#3B4252"> { useTabs } </text><text x="450" y="96" fill="#7C3AED">from</text>
    <text x="362" y="108" fill="#7C3AED">export</text><text x="390" y="108" fill="#7C3AED">function</text><text x="426" y="108" fill="#2563EB">Sidebar</text><text x="460" y="108" fill="#3B4252">() {</text>
    <text x="370" y="120" fill="#7C3AED">return</text><text x="398" y="120" fill="#3B4252">&lt;</text><text x="406" y="120" fill="#D97706">FileTree</text><text x="442" y="120" fill="#3B4252">/&gt;</text>
    <text x="362" y="132" fill="#3B4252">}</text>
  </g>
  <rect x="488" y="66" width="108" height="56" rx="6" fill="#FBFCFE" stroke="#EDF0F7"/>
  <g class="ui" font-size="7.5" fill="#8A93A6">
