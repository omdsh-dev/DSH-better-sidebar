  <rect x="178" y="66" width="60" height="4" rx="2" fill="#9DB0F0"/>
  <rect x="178" y="74" width="42" height="4" rx="2" fill="#C4CFF5"/>
  <rect x="72" y="98" width="156" height="6" rx="3" fill="#DDE3EE"/>
  <rect x="72" y="110" width="132" height="6" rx="3" fill="#DDE3EE"/>
