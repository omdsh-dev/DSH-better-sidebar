<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Better Sidebar：每个会话独立的右侧栏工作台，含文件、编辑器、文件变动、任务与侧边对话">
