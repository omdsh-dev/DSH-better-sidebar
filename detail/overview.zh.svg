  <g class="mono" font-size="7.6" xml:space="preserve">
    <text x="414" y="103" fill="#B6BDCB">1</text>
    <text x="428" y="103" fill="#7C3AED">import</text><text x="462" y="103" fill="#3B4252"> { useMemo } </text><text x="518" y="103" fill="#7C3AED">from</text><text x="540" y="103" fill="#0E9F6E">'react'</text>
    <text x="414" y="116" fill="#B6BDCB">2</text>
    <text x="428" y="116" fill="#7C3AED">import</text><text x="462" y="116" fill="#3B4252"> { FileTree } </text><text x="531" y="116" fill="#7C3AED">from</text><text x="553" y="116" fill="#0E9F6E">'./FileTree'</text>
    <text x="414" y="129" fill="#B6BDCB">3</text>
    <text x="428" y="129" fill="#7C3AED">export</text><text x="456" y="129" fill="#7C3AED"> function</text><text x="496" y="129" fill="#2563EB"> Sidebar</text><text x="532" y="129" fill="#3B4252">() {</text>
    <text x="414" y="142" fill="#B6BDCB">4</text>
    <text x="428" y="142" fill="#3B4252">  </text><text x="438" y="142" fill="#7C3AED">const</text><text x="462" y="142" fill="#3B4252"> tabs = </text><text x="500" y="142" fill="#2563EB">useTabs</text><text x="538" y="142" fill="#3B4252">()</text>
    <text x="414" y="159" fill="#B6BDCB">5</text>
    <text x="428" y="159" fill="#3B4252">  </text><text x="438" y="159" fill="#7C3AED">return</text><text x="468" y="159" fill="#3B4252"> &lt;</text><text x="478" y="159" fill="#D97706">FileTree</text><text x="516" y="159" fill="#3B4252"> tabs=</text><text x="544" y="159" fill="#3B4252">{tabs} /&gt;</text>
    <text x="414" y="172" fill="#B6BDCB">6</text>
    <text x="428" y="172" fill="#3B4252">}</text>
    <text x="414" y="185" fill="#B6BDCB">7</text>
    <text x="428" y="185" fill="#8A93A6">// per-conversation state</text>
    <text x="414" y="198" fill="#B6BDCB">8</text>
    <text x="428" y="198" fill="#7C3AED">const</text><text x="452" y="198" fill="#3B4252"> store = </text><text x="494" y="198" fill="#2563EB">useSidebarStore</text><text x="566" y="198" fill="#3B4252">()</text>
  </g>
